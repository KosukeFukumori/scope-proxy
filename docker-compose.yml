services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - scope_proxy_db:/app/backend/data
    environment:
      # Store the SQLite file on the persistent volume above.
      DATABASE_URL: sqlite:////app/backend/data/scope_proxy.db
      # Uncomment and set a fixed value for production; otherwise a random
      # SECRET_KEY is generated on every restart and sessions are invalidated
      # each time the container restarts.
      # SECRET_KEY: change-me-to-a-random-secret
      # Uncomment both to have `create_admin_user.py` create the initial admin
      # user non-interactively (e.g. from an init container or entrypoint).
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me
    healthcheck:
      # Use the stdlib instead of curl since the image doesn't ship curl.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/_admin/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  scope_proxy_db:
